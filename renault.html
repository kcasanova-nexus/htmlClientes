<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen de Semana - RENAULT</title>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
<style>
:root{--bg:#121212;--panel:#1f1f1f;--panel2:#1e1e1e;--header:#333;--text:#f0f0f0;--green:#58c45f;--green2:#3b6f35;--red:#ff5252}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:13px}
.container{max-width:1500px;margin:auto;padding:24px 28px}
h1{text-align:center;color:var(--green);font-size:28px;margin:14px 0 26px}
#resumen{background:var(--panel);border:1px solid #3a3a3a;border-radius:8px;padding:24px 18px;margin-bottom:24px;min-height:170px}
#resumen p{margin:0 0 12px;font-size:14px;font-weight:700}
.positivo{color:#00e676;font-weight:800} .negativo{color:var(--red);font-weight:800}
#loading,#error{text-align:center;margin:20px 0;font-size:16px} #loading{color:#aaa} #error{display:none;color:var(--red)}
.table-wrap{overflow-x:auto}
table.dataTable{width:100%!important;background:var(--panel2);color:var(--text);border:1px solid #444;font-size:13px}
table.dataTable th,table.dataTable td{white-space:nowrap;padding:10px 12px;border-bottom:1px solid #2a2a2a}
table.dataTable thead th{background:var(--header);color:#fff;text-align:center!important;font-weight:700;vertical-align:middle}
table.dataTable tbody td{background:var(--panel2)}
table.dataTable thead th,table.dataTable tbody td{text-align:center!important;vertical-align:middle!important}
tr.fila-separadora td{background:#101010!important;color:var(--green)!important;text-align:center!important;font-weight:800!important;font-size:15px!important;border-top:2px solid var(--green)!important;border-bottom:2px solid var(--green)!important;padding:14px 12px!important}
td.estado-pagado{background:var(--green2)!important;color:#fff!important;text-align:center!important;font-weight:700}
.dataTables_wrapper,.dataTables_wrapper .dataTables_length,.dataTables_wrapper .dataTables_filter,.dataTables_wrapper .dataTables_info,.dataTables_wrapper .dataTables_paginate{color:#fff!important}
.dataTables_wrapper .dataTables_filter input,.dataTables_wrapper .dataTables_length select{background:#333;color:#fff;border:1px solid #555;border-radius:4px;padding:6px}
.dataTables_wrapper .dataTables_paginate .paginate_button{color:#fff!important;border:1px solid #444!important;background:#1f1f1f!important;border-radius:4px;margin:2px}
.dataTables_wrapper .dataTables_paginate .paginate_button.current{background:#3c7d40!important;color:#fff!important}
@media(max-width:768px){.container{padding:16px 10px}h1{font-size:22px}table.dataTable{font-size:12px}table.dataTable th,table.dataTable td{padding:8px}}
</style>
</head>
<body>
<div class="container">
<h1>Resumen de Semana - RENAULT</h1>
<div id="resumen">
<p><strong id="semana_linea"></strong></p>
<p><strong>Ganancias Totales:</strong> <span id="ganancia"></span></p>
<p><strong>Reembolsos:</strong> <span id="reembolso"></span></p>
<p><strong>Efectivo:</strong> <span id="efectivo"></span></p>
<p><strong>Cuota:</strong> <span id="cuota"></span></p>
<p><strong>Saldo Semana:</strong> <span id="saldo"></span></p>
</div>
<div id="loading">Cargando datos desde Google Sheets...</div>
<div id="error"></div>
<div class="table-wrap"><table id="tablaPagos" class="display" style="display:none"></table></div>
</div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRIBn-MQTVJNNbgutD6dJQ1aR4wT-1VZh4P4tBPZZNP0dcAbnccV2SkOS-VZuHtfgmuNGCkvE4q9Hr1/pub?gid=240735274&single=true&output=tsv";
function noCache(u){return u+(u.includes("?")?"&":"?")+"cacheBust="+Date.now()}
function limpiarNumero(v){if(!v)return 0;let t=String(v).replace("₡","").replace(/\s/g,"").replace("−","-");if(t.includes(",")&&t.includes("."))t=t.replace(/\./g,"").replace(",",".");else t=t.replace(",",".");return parseFloat(t.replace(/[^0-9.\-]/g,""))||0}
function textoFila(r){return r.map(c=>String(c||"").trim()).join(" ").toLowerCase()}
function separador(r){const t=textoFila(r);if(t.includes("financiamiento opcional"))return "Financiamiento opcional";if(t.includes("semanas atrasadas"))return "Semanas atrasadas";return ""}
function mostrarError(m){loading.style.display="none";error.textContent=m;error.style.display="block"}
async function cargar(){
 try{
  const res=await fetch(noCache(SHEET_URL),{cache:"no-store"});
  if(!res.ok)throw new Error(res.status);
  const tsv=await res.text();
  Papa.parse(tsv,{
   delimiter:"\t",header:false,skipEmptyLines:true,
   complete:function(r){
    try{
     const data=r.data.filter(row=>row.some(c=>String(c||"").trim()!==""));
     const labels=data.map(row=>String(row[0]||"").trim());
     const vals=data.map(row=>String(row[1]||"").trim());

     const si=labels.findIndex(x=>["semana","semana #"].includes(x.toLowerCase()));
     if(si!==-1&&vals[si])semana_linea.textContent="Semana #"+vals[si];

     const gi=labels.findIndex(x=>x.toLowerCase()==="ganancias totales");
     if(gi!==-1){
      ganancia.textContent=vals[gi]||"";
      reembolso.textContent=vals[gi+1]||"";
      efectivo.textContent=vals[gi+2]||"";
      cuota.textContent=vals[gi+3]||"";
      const st=vals[gi+4]||"";
      saldo.textContent=st;
      saldo.className=limpiarNumero(st)>=0?"positivo":"negativo";
     }

     const hi=data.findIndex(row=>{const c=row.map(x=>String(x||"").trim().toLowerCase());return c.includes("semana")&&c.includes("fecha")});
     if(hi===-1)throw new Error("encabezado");

     const headers=data[hi].map(h=>String(h||"").trim());
     const rows=data.slice(hi+1).filter(row=>row.some(c=>String(c||"").trim()!=="")).map(row=>{let f=[...row];while(f.length<headers.length)f.push("");return f.slice(0,headers.length)});

     const estadoIndex=headers.findIndex(h=>h.toLowerCase()==="estado");
     const defs=[{targets:"_all",className:"dt-center"}];

     const tabla=$("#tablaPagos").DataTable({
      data:rows,
      columns:headers.map(h=>({title:h})),
      columnDefs:defs,
      pageLength:20,
      paging:true,
      searching:true,
      ordering:true,
      fixedHeader:true,
      language:{search:"Buscar semana:",lengthMenu:"Mostrar _MENU_ registros",zeroRecords:"No se encontró nada",info:"Mostrando _TOTAL_ registros",infoEmpty:"No hay registros",infoFiltered:"(filtrado de _MAX_ totales)",paginate:{previous:"Anterior",next:"Siguiente"}},
      createdRow:function(row,rowData){
       const sep=separador(rowData);
       if(sep){
        $(row).addClass("fila-separadora");
        const c=$("td",row);
        c.eq(0).attr("colspan",headers.length).text(sep);
        c.slice(1).remove();
        return;
       }
       if(estadoIndex!==-1){
        const estado=String(rowData[estadoIndex]||"").trim().toLowerCase();
        if(estado==="pagado")$("td",row).eq(estadoIndex).addClass("estado-pagado");
       }
      },
      initComplete:function(){
       $("#tablaPagos thead th").css({
         "text-align":"center",
         "vertical-align":"middle"
       });
      }
     });

     $(".dataTables_filter input").off().on("keyup change",function(){tabla.column(0).search(this.value).draw()});
     loading.style.display="none";
     tablaPagos.style.display="table";
    }catch(e){console.error(e);mostrarError("Error al interpretar la estructura de la hoja.")}
   },
   error:function(e){console.error(e);mostrarError("No se pudo leer la información de Google Sheets.")}
  });
 }catch(e){console.error(e);mostrarError("Error al cargar los datos. Revisa que la hoja siga publicada.")}
}
cargar();
</script>
</body>
</html>
